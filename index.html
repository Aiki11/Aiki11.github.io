<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오목 노트</title>
<style>
:root{
  --bg:#e6eae5; --panel:#f7f8f5; --ink:#1c2420; --muted:#5f6b65; --rule:#c9d0ca;
  --btn:#ffffff; --btn-ink:#1c2420; --primary:#1f5f57; --primary-ink:#ffffff;
  --danger:#a8322a; --board:#d8aa63; --board-edge:#b98a45; --grid:#4b3a1f;
  --link:#11756d; --forbid:#c0392b; --last:#d6452f;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141917; --panel:#1d2421; --ink:#e3e8e4; --muted:#93a19a; --rule:#33403a;
    --btn:#26302c; --btn-ink:#e3e8e4; --primary:#2f8a7f; --primary-ink:#ffffff;
    --danger:#d1574d; --board:#c99a55; --board-edge:#a47838; --grid:#3d2f18;
    --link:#0d6b63; --forbid:#b3261e; --last:#e0442b;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px; line-height:1.5;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color:transparent;
}
body.locked{overflow:hidden}
.wrap{max-width:540px;margin:0 auto;padding:12px 12px 32px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
h1{font-size:1.25rem;margin:0;font-weight:700;letter-spacing:-0.01em}
.path{font-size:.85rem;color:var(--muted);overflow-x:auto;white-space:nowrap;margin-bottom:4px}
.pos{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;color:var(--muted);
  overflow-x:auto;white-space:nowrap;padding-bottom:2px;margin-bottom:8px}
.board-box{background:var(--board);border:2px solid var(--board-edge);border-radius:6px;padding:0;touch-action:manipulation}
svg.board{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.row .grow{flex:1}
button{
  font:inherit;font-size:.95rem;min-height:44px;padding:0 14px;border-radius:8px;
  border:1px solid var(--rule);background:var(--btn);color:var(--btn-ink);cursor:pointer;
  touch-action:manipulation;
}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
button.danger{color:var(--danger)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.step{min-width:76px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.hint{font-size:.85rem;color:var(--muted);margin-top:8px;min-height:1.3em}
label.memo-label{display:block;font-size:.9rem;font-weight:600;margin:14px 0 4px}
textarea{
  width:100%;min-height:150px;resize:vertical;font:inherit;font-size:16px;line-height:1.55;
  padding:10px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);
}
.files{border-top:1px solid var(--rule);margin-top:18px;padding-top:6px}
#overlay{position:fixed;inset:0;background:var(--bg);overflow-y:auto;display:none;z-index:10;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#overlay.open{display:block}
.sub{font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>

<div class="wrap" id="main">
  <header>
    <h1>오목 노트</h1>
    <span class="sub" id="dirtyMark"></span>
  </header>
  <div class="path" id="pathText"></div>
  <div class="pos" id="posText"></div>

  <div class="board-box"><svg class="board" id="mainBoard"></svg></div>

  <div class="row">
    <button id="btnPrev" aria-label="이전 수">◀ 이전</button>
    <div class="step" id="stepText"></div>
    <button id="btnNext" aria-label="다음 수">다음 ▶</button>
  </div>
  <div class="hint" id="mainHint"></div>

  <div class="row">
    <button id="btnParent" class="grow">부모 노드로</button>
    <button id="btnDelete" class="danger">노드 삭제</button>
  </div>

  <label class="memo-label" for="mainMemo">메모</label>
  <textarea id="mainMemo" placeholder="이 국면에 대한 메모"></textarea>

  <div class="row files">
    <button id="btnSave" class="grow">JSON 저장</button>
    <button id="btnLoad" class="grow">JSON 불러오기</button>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
  </div>
</div>

<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="editTitle">
  <div class="wrap">
    <header>
      <h1 id="editTitle">새 분기</h1>
      <span class="sub" id="editCount"></span>
    </header>
    <div class="pos" id="editPos"></div>
    <div class="board-box"><svg class="board" id="editBoard"></svg></div>
    <div class="row">
      <button id="btnUndo">수 무르기</button>
      <div class="grow"></div>
    </div>
    <div class="hint">빈 칸을 눌러 이어서 둘 수 있습니다.</div>
    <label class="memo-label" for="editMemo">메모</label>
    <textarea id="editMemo" placeholder="새 국면에 대한 메모"></textarea>
    <div class="row">
      <button id="btnEditClose" class="grow">저장하지 않고 닫기</button>
      <button id="btnEditSave" class="primary grow">저장</button>
    </div>
  </div>
</div>

<script>
/* ===================== 좌표·인코딩 ===================== */
const N = 15;
const HEX = "0123456789ABCDEF";
const VALID = "123456789ABCDEF";
const enc = (x, y) => HEX[x] + HEX[y];
function parsePos(s){
  const m = [];
  for (let i = 0; i < s.length; i += 2) m.push([HEX.indexOf(s[i]), HEX.indexOf(s[i+1])]);
  return m;
}
function buildBoard(moves, n){
  const b = new Int8Array(256);          // 0 빈칸, 1 흑, 2 백
  for (let i = 0; i < n; i++){ const [x,y] = moves[i]; b[x*16+y] = (i % 2 === 0) ? 1 : 2; }
  return b;
}
function at(b, x, y){ return (x < 1 || x > N || y < 1 || y > N) ? 3 : b[x*16+y]; }

/* ===================== 흑 금수 판정 (렌주) ===================== */
const DIRS = [[1,0],[0,1],[1,1],[1,-1]];

// (x,y)를 지나는 연속된 흑돌의 범위 [lo, hi] (오프셋)
function blackRun(b, x, y, dx, dy){
  let lo = 0, hi = 0;
  while (at(b, x+(hi+1)*dx, y+(hi+1)*dy) === 1) hi++;
  while (at(b, x+(lo-1)*dx, y+(lo-1)*dy) === 1) lo--;
  return [lo, hi];
}

// p가 놓인 상태에서, 방향 d로 p가 만든 4의 개수 (같은 줄의 두 4도 각각 셈, 열린 4는 1)
function countFours(b, x, y, dx, dy){
  const ks = [];
  for (let k = -4; k <= 4; k++){
    if (!k) continue;
    const qx = x+k*dx, qy = y+k*dy;
    if (at(b, qx, qy) !== 0) continue;
    b[qx*16+qy] = 1;
    const [lo, hi] = blackRun(b, qx, qy, dx, dy);
    b[qx*16+qy] = 0;
    if (hi - lo + 1 === 5 && lo <= -k && -k <= hi) ks.push(k);
  }
  if (ks.length === 2 && Math.abs(ks[0] - ks[1]) === 5){
    const a = Math.min(ks[0], ks[1]);
    let solid = true;
    for (let t = a+1; t < a+5; t++) if (at(b, x+t*dx, y+t*dy) !== 1) solid = false;
    if (solid) return 1;
  }
  return Math.min(ks.length, 2);
}

// p가 놓인 상태에서, 방향 d로 p를 포함하는 '진짜 3'이 있는지
function hasThree(b, x, y, dx, dy, depth){
  for (let k = -4; k <= 4; k++){
    if (!k) continue;
    const qx = x+k*dx, qy = y+k*dy;
    if (at(b, qx, qy) !== 0) continue;
    b[qx*16+qy] = 1;
    const [lo, hi] = blackRun(b, qx, qy, dx, dy);
    let straight = false;
    if (hi - lo + 1 === 4 && lo <= -k && -k <= hi){
      straight =
        at(b, qx+(lo-1)*dx, qy+(lo-1)*dy) === 0 &&
        at(b, qx+(hi+1)*dx, qy+(hi+1)*dy) === 0 &&
        at(b, qx+(lo-2)*dx, qy+(lo-2)*dy) !== 1 &&
        at(b, qx+(hi+2)*dx, qy+(hi+2)*dy) !== 1;
    }
    b[qx*16+qy] = 0;
    if (straight && !isForbidden(b, qx, qy, depth+1)) return true;
  }
  return false;
}

// 빈 칸 (x,y)가 흑에게 금수인지
function isForbidden(b, x, y, depth = 0){
  if (at(b, x, y) !== 0) return false;
  b[x*16+y] = 1;
  try {
    let five = false, over = false;
    for (const [dx,dy] of DIRS){
      const [lo, hi] = blackRun(b, x, y, dx, dy);
      const len = hi - lo + 1;
      if (len === 5) five = true; else if (len > 5) over = true;
    }
    if (five) return false;            // 정확한 5는 금수보다 우선
    if (over) return true;             // 장목
    let fours = 0;
    for (const [dx,dy] of DIRS) fours += countFours(b, x, y, dx, dy);
    if (fours >= 2) return true;       // 44
    if (depth < 12){
      let threes = 0;
      for (const [dx,dy] of DIRS) if (hasThree(b, x, y, dx, dy, depth)) threes++;
      if (threes >= 2) return true;    // 33
    }
    return false;
  } finally {
    b[x*16+y] = 0;
  }
}
function forbiddenSet(b){
  const s = new Set();
  for (let x = 1; x <= N; x++) for (let y = 1; y <= N; y++)
    if (b[x*16+y] === 0 && isForbidden(b, x, y)) s.add(enc(x,y));
  return s;
}

/* ===================== 판 그리기 ===================== */
const C = 40, M = 34, VB = M*2 + C*(N-1);
const px = x => M + (x-1)*C;
const py = y => M + (N-y)*C;

function drawBoard(svg, opt){
  // opt: { moves, shown, links:Set, forbid:Set }
  const o = [];
  o.push(`<rect x="0" y="0" width="${VB}" height="${VB}" fill="var(--board)"/>`);
  for (let i = 1; i <= N; i++){
    o.push(`<line x1="${px(1)}" y1="${py(i)}" x2="${px(N)}" y2="${py(i)}" stroke="var(--grid)" stroke-width="${i===1||i===N?1.6:1}"/>`);
    o.push(`<line x1="${px(i)}" y1="${py(1)}" x2="${px(i)}" y2="${py(N)}" stroke="var(--grid)" stroke-width="${i===1||i===N?1.6:1}"/>`);
    o.push(`<text x="${px(i)}" y="${VB-9}" font-size="13" text-anchor="middle" fill="var(--grid)">${HEX[i]}</text>`);
    o.push(`<text x="12" y="${py(i)+4.5}" font-size="13" text-anchor="middle" fill="var(--grid)">${HEX[i]}</text>`);
  }
  for (const [sx,sy] of [[4,4],[12,4],[4,12],[12,12],[8,8]])
    o.push(`<circle cx="${px(sx)}" cy="${py(sy)}" r="3.6" fill="var(--grid)"/>`);

  if (opt.forbid) for (const k of opt.forbid){
    const [x,y] = parsePos(k)[0], cx = px(x), cy = py(y), r = 8;
    o.push(`<path d="M${cx-r} ${cy-r}L${cx+r} ${cy+r}M${cx+r} ${cy-r}L${cx-r} ${cy+r}" stroke="var(--forbid)" stroke-width="3" stroke-linecap="round"/>`);
  }
  if (opt.links) for (const k of opt.links){
    const [x,y] = parsePos(k)[0];
    o.push(`<circle cx="${px(x)}" cy="${py(y)}" r="14" fill="var(--link)" fill-opacity=".28" stroke="var(--link)" stroke-width="3"/>`);
  }
  const { moves, shown } = opt;
  for (let i = 0; i < shown; i++){
    const [x,y] = moves[i], black = i % 2 === 0, last = i === shown - 1;
    o.push(`<circle cx="${px(x)}" cy="${py(y)}" r="18.2" fill="${black?'#151515':'#f6f6f2'}" stroke="${black?'#000':'#6d6d66'}" stroke-width="1.2"/>`);
    const n = i + 1, fs = n >= 100 ? 12.5 : 15.5;
    const col = last ? 'var(--last)' : (black ? '#f6f6f2' : '#151515');
    o.push(`<text x="${px(x)}" y="${py(y)+fs*0.36}" font-size="${fs}" font-weight="${last?700:500}" text-anchor="middle" fill="${col}" style="font-variant-numeric:tabular-nums">${n}</text>`);
  }
  svg.setAttribute("viewBox", `0 0 ${VB} ${VB}`);
  svg.innerHTML = o.join("");
}

function cellFromEvent(svg, e){
  const r = svg.getBoundingClientRect();
  const vx = (e.clientX - r.left) / r.width * VB;
  const vy = (e.clientY - r.top) / r.height * VB;
  const x = Math.round((vx - M) / C) + 1;
  const y = N - Math.round((vy - M) / C);
  if (x < 1 || x > N || y < 1 || y > N) return null;
  if (Math.hypot(vx - px(x), vy - py(y)) > C * 0.55) return null;
  return [x, y];
}

/* ===================== 상태 ===================== */
const newNode = (position) => ({ position, note: "", children: [] });
let root = newNode("");
let path = [root];       // 루트부터 현재 노드까지
let step = 0;            // 다시보기에서 보여 주는 수의 개수
let dirty = false;
let edit = null;         // { parent, base, moves }

const $ = id => document.getElementById(id);
const cur = () => path[path.length - 1];
const firstMove = (child, parent) => child.position.substr(parent.position.length, 2);

function setDirty(v){ dirty = v; $("dirtyMark").textContent = v ? "저장되지 않은 변경 있음" : ""; }

/* ===================== 일반 화면 ===================== */
function renderMain(){
  const node = cur();
  const moves = parsePos(node.position);
  const total = moves.length;
  if (step > total) step = total;
  const b = buildBoard(moves, step);
  const atEnd = step === total;
  const links = new Set();
  if (atEnd) for (const ch of node.children) links.add(firstMove(ch, node));

  drawBoard($("mainBoard"), { moves, shown: step, links, forbid: forbiddenSet(b) });

  $("pathText").textContent = path.map((n, i) => i === 0 ? "루트" : `${n.position.length/2}수`).join(" › ");
  $("posText").textContent = node.position || "(빈 판)";
  $("stepText").textContent = `${step} / ${total}`;
  $("btnPrev").disabled = step === 0;
  $("btnNext").disabled = atEnd;
  $("btnParent").disabled = path.length === 1;
  $("btnDelete").disabled = path.length === 1;
  $("mainHint").textContent = atEnd
    ? (node.children.length ? `분기 ${node.children.length}개` : "빈 칸을 눌러 새 분기를 만들 수 있습니다.")
    : "다시보기 중입니다. 마지막 수에서 분기를 사용할 수 있습니다.";
}

function goTo(node){
  path.push(node);
  step = parsePos(node.position).length;
  $("mainMemo").value = node.note;
  renderMain();
  window.scrollTo(0, 0);
}
function goParent(){
  if (path.length === 1) return;
  path.pop();
  step = cur().position.length / 2;
  $("mainMemo").value = cur().note;
  renderMain();
}
function countNodes(n){ return 1 + n.children.reduce((s, c) => s + countNodes(c), 0); }

$("mainBoard").addEventListener("click", e => {
  const node = cur();
  const total = node.position.length / 2;
  if (step !== total) return;
  const c = cellFromEvent($("mainBoard"), e);
  if (!c) return;
  const key = enc(c[0], c[1]);
  const child = node.children.find(ch => firstMove(ch, node) === key);
  if (child){ goTo(child); return; }
  if (occupied(node.position, key)) return;
  openEditor(node, c);
});
function occupied(pos, key){
  for (let i = 0; i < pos.length; i += 2) if (pos.substr(i, 2) === key) return true;
  return false;
}

$("btnPrev").onclick = () => { if (step > 0){ step--; renderMain(); } };
$("btnNext").onclick = () => { if (step < cur().position.length/2){ step++; renderMain(); } };
$("btnParent").onclick = goParent;
$("btnDelete").onclick = () => {
  if (path.length === 1) return;
  const node = cur(), sub = countNodes(node) - 1;
  const msg = sub ? `이 노드와 하위 노드 ${sub}개를 삭제합니다. 계속할까요?` : "이 노드를 삭제합니다. 계속할까요?";
  if (!confirm(msg)) return;
  const parent = path[path.length - 2];
  parent.children.splice(parent.children.indexOf(node), 1);
  setDirty(true);
  goParent();
};
$("mainMemo").addEventListener("input", e => { cur().note = e.target.value; setDirty(true); });

/* ===================== 편집 화면 ===================== */
function openEditor(parent, cell){
  const moves = parsePos(parent.position);
  edit = { parent, base: moves.length, moves: [...moves, cell] };
  $("editMemo").value = "";
  $("overlay").classList.add("open");
  document.body.classList.add("locked");
  $("overlay").scrollTop = 0;
  renderEdit();
}
function closeEditor(){
  edit = null;
  $("overlay").classList.remove("open");
  document.body.classList.remove("locked");
}
function editPosition(){ return edit.moves.map(([x,y]) => enc(x,y)).join(""); }
function renderEdit(){
  const b = buildBoard(edit.moves, edit.moves.length);
  drawBoard($("editBoard"), { moves: edit.moves, shown: edit.moves.length, forbid: forbiddenSet(b) });
  const added = edit.moves.length - edit.base;
  $("editCount").textContent = `${edit.moves.length}수 (새로 둔 수 ${added})`;
  $("editPos").textContent = editPosition();
  $("btnUndo").disabled = added <= 1;
}
$("editBoard").addEventListener("click", e => {
  if (!edit) return;
  const c = cellFromEvent($("editBoard"), e);
  if (!c) return;
  if (edit.moves.some(([x,y]) => x === c[0] && y === c[1])) return;
  edit.moves.push(c);
  renderEdit();
});
$("btnUndo").onclick = () => {
  if (edit && edit.moves.length - edit.base > 1){ edit.moves.pop(); renderEdit(); }
};
$("btnEditClose").onclick = () => {
  const changed = edit.moves.length - edit.base > 1 || $("editMemo").value.trim() !== "";
  if (changed && !confirm("저장하지 않고 닫으면 이 분기는 사라집니다. 닫을까요?")) return;
  closeEditor();
};
$("btnEditSave").onclick = () => {
  const child = { position: editPosition(), note: $("editMemo").value, children: [] };
  edit.parent.children.push(child);
  setDirty(true);
  closeEditor();
  goTo(child);
};

/* ===================== JSON 저장·불러오기 ===================== */
$("btnSave").onclick = () => {
  const blob = new Blob([JSON.stringify(root, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "omok-note.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  setDirty(false);
};
$("btnLoad").onclick = () => {
  if (dirty && !confirm("저장하지 않은 변경이 사라집니다. 불러올까요?")) return;
  $("fileInput").value = "";
  $("fileInput").click();
};
$("fileInput").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); }
  catch { alert("JSON 형식이 올바르지 않아 불러오지 못했습니다."); return; }
  const warnings = [];
  let loaded;
  try { loaded = normalize(data, null, warnings); }
  catch (err){ alert("불러오지 못했습니다.\n" + err.message); return; }
  root = loaded; path = [root]; step = 0;
  $("mainMemo").value = root.note;
  setDirty(false);
  renderMain();
  if (warnings.length) alert("불러왔지만 확인이 필요한 부분이 있습니다.\n\n" + warnings.slice(0, 10).join("\n") +
    (warnings.length > 10 ? `\n외 ${warnings.length - 10}건` : ""));
});

function normalize(obj, parentPos, warnings){
  if (typeof obj !== "object" || obj === null || Array.isArray(obj))
    throw new Error("노드가 객체 형식이 아닙니다.");
  if (typeof obj.position !== "string") throw new Error("position이 문자열이 아닌 노드가 있습니다.");
  const pos = obj.position.toUpperCase();
  const label = pos || "(빈 판)";
  if (pos.length % 2) throw new Error(`position 길이가 홀수입니다: ${label}`);
  for (const ch of pos) if (!VALID.includes(ch)) throw new Error(`position에 1~F 이외의 문자가 있습니다: ${label}`);
  const seen = new Set();
  for (let i = 0; i < pos.length; i += 2){
    const k = pos.substr(i, 2);
    if (seen.has(k)) throw new Error(`같은 칸에 돌이 두 번 놓였습니다(${k}): ${label}`);
    seen.add(k);
  }
  if (parentPos === null){
    if (pos !== "") throw new Error("루트 노드의 position은 빈 문자열이어야 합니다.");
  } else if (!pos.startsWith(parentPos) || pos.length <= parentPos.length){
    throw new Error(`자식 노드가 부모 국면 이후의 국면이 아닙니다: ${label}`);
  }
  const note = typeof obj.note === "string" ? obj.note : (obj.note == null ? "" : String(obj.note));
  const rawKids = obj.children == null ? [] : obj.children;
  if (!Array.isArray(rawKids)) throw new Error(`children이 배열이 아닙니다: ${label}`);
  const children = rawKids.map(c => normalize(c, pos, warnings));
  const firsts = new Map();
  for (const c of children){
    const k = c.position.substr(pos.length, 2);
    if (firsts.has(k)) warnings.push(`형제 노드의 첫 수가 겹칩니다(${k}): ${label}`);
    else firsts.set(k, true);
  }
  return { position: pos, note, children };
}

window.addEventListener("beforeunload", e => { if (dirty){ e.preventDefault(); e.returnValue = ""; } });

/* ===================== 시작 ===================== */
$("mainMemo").value = root.note;
renderMain();
</script>
