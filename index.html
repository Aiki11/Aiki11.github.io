<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Infinite Chess Mate Notebook</title>
  <style>
    :root {
      --app-bg: #ede9df;
      --panel-bg: #f8f6f0;
      --board-light: #f0d9b5;
      --board-dark: #b58863;
      --board-line: rgba(31, 41, 55, 0.18);
      --major-line: rgba(17, 24, 39, 0.36);
      --ink: #1f2937;
      --muted: #6b7280;
      --line: rgba(31,41,55,.16);
      --cell-size: 40px;
      --board-size: calc(100 * var(--cell-size));
      --palette-gap: 8px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      overscroll-behavior: none; background: var(--app-bg); color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, textarea { font: inherit; }
    .app {
      width: 100%; height: 100%;
      display: grid; grid-template-rows: auto 1fr;
      gap: 10px; padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
    }

    .board-shell {
      position: relative; width: min(100vw - 16px, 72vh); max-width: 720px;
      aspect-ratio: 1 / 1; margin: 0 auto;
      border-radius: 14px; overflow: hidden; background: #111827;
      box-shadow: 0 6px 24px rgba(0,0,0,.18);
      touch-action: none;
    }
    .board-viewport { position: absolute; inset: 0; overflow: hidden; touch-action: none; background: #222; }
    .board-layer {
      position: absolute; left: 0; top: 0; width: var(--board-size); height: var(--board-size);
      transform-origin: 0 0; will-change: transform;
      background-color: var(--board-light);
      background-image:
        linear-gradient(45deg, var(--board-dark) 25%, transparent 25%),
        linear-gradient(-45deg, var(--board-dark) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--board-dark) 75%),
        linear-gradient(-45deg, transparent 75%, var(--board-dark) 75%),
        linear-gradient(to right, var(--board-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--board-line) 1px, transparent 1px),
        linear-gradient(to right, transparent calc(10 * var(--cell-size) - 2px), var(--major-line) calc(10 * var(--cell-size) - 2px), var(--major-line) calc(10 * var(--cell-size)), transparent calc(10 * var(--cell-size))),
        linear-gradient(to bottom, transparent calc(10 * var(--cell-size) - 2px), var(--major-line) calc(10 * var(--cell-size) - 2px), var(--major-line) calc(10 * var(--cell-size)), transparent calc(10 * var(--cell-size)));
      background-size:
        calc(2 * var(--cell-size)) calc(2 * var(--cell-size)),
        calc(2 * var(--cell-size)) calc(2 * var(--cell-size)),
        calc(2 * var(--cell-size)) calc(2 * var(--cell-size)),
        calc(2 * var(--cell-size)) calc(2 * var(--cell-size)),
        var(--cell-size) var(--cell-size),
        var(--cell-size) var(--cell-size),
        calc(10 * var(--cell-size)) calc(10 * var(--cell-size)),
        calc(10 * var(--cell-size)) calc(10 * var(--cell-size));
      background-position:
        0 0, 0 var(--cell-size), var(--cell-size) calc(-1 * var(--cell-size)), calc(-1 * var(--cell-size)) 0,
        0 0, 0 0, 0 0, 0 0;
    }

    .mode-toggle {
      position: absolute; top: 10px; right: 10px; z-index: 5;
      width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(0,0,0,.18);
      background: rgba(255,255,255,.88); display: grid; place-items: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.22); backdrop-filter: blur(8px);
    }
    .mode-toggle svg { width: 25px; height: 25px; }
    .mode-toggle .stroke { fill: none; stroke: #111827; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    .bottom-panel {
      min-height: 0; border: 1px solid var(--line); border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      padding: 10px; background: var(--panel-bg);
      overflow: hidden;
    }
    .piece-palette {
      display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(3, minmax(58px, 1fr));
      gap: var(--palette-gap); width: 100%; height: 100%;
    }
    .palette-cell {
      position: relative; min-height: 58px; border: 1px solid var(--line); border-radius: 14px;
      background: rgba(255,255,255,.82); display: grid; place-items: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.5); padding: 3px;
    }
    .palette-cell img {
      width: min(50px, 82%); height: min(50px, 82%); object-fit: contain; display: block;
      user-select: none; pointer-events: none;
    }
    .palette-code {
      position: absolute; right: 5px; bottom: 3px; font-size: 10px; font-weight: 800;
      color: rgba(31,41,55,.54); line-height: 1;
    }
    .color-toggle { font-weight: 900; }
    .color-toggle.white-side { background: #fff; color: #111827; }
    .color-toggle.black-side { background: #111827; color: #fff; border-color: #111827; }
    .toggle-mark { display: grid; place-items: center; gap: 3px; font-size: 10px; }
    .toggle-mark .disc { width: 26px; height: 26px; border-radius: 999px; border: 2px solid currentColor; background: currentColor; box-shadow: inset 0 0 0 6px rgba(255,255,255,.38); }

    .description-wrap { display: none; height: 100%; }
    .description-wrap textarea {
      width: 100%; height: 100%; min-height: 160px; resize: none;
      border: 1px solid var(--line); border-radius: 16px; padding: 12px;
      background: rgba(255,255,255,.9); outline: none;
    }
    .highlight-mode .piece-palette { display: none; }
    .highlight-mode .description-wrap { display: block; }
  </style>
</head>
<body>
  <main class="app edit-mode" id="app">
    <section class="board-shell">
      <div class="board-viewport" id="boardViewport">
        <div class="board-layer" id="boardLayer"></div>
      </div>
      <button class="mode-toggle" id="modeToggle" type="button" aria-label="mode toggle"></button>
    </section>

    <section class="bottom-panel">
      <div class="piece-palette" id="piecePalette"></div>
      <div class="description-wrap">
        <textarea placeholder="체크메이트 패턴, 강제 수순, 기물 역할 등을 적어두세요."></textarea>
      </div>
    </section>
  </main>

  <script>
    const BOARD_SIZE = 100;
    const CELL_SIZE = 40;
    const INITIAL_VISIBLE_CELLS = 10;

    const app = document.getElementById('app');
    const boardViewport = document.getElementById('boardViewport');
    const boardLayer = document.getElementById('boardLayer');
    const modeToggle = document.getElementById('modeToggle');
    const piecePalette = document.getElementById('piecePalette');

    let mode = 'edit';
    let pieceColor = 'white';
    let transform = { x: 0, y: 0, scale: 1 };
    let activeGesture = null;
    let ignoreUntilNoTouches = false;

    const COMMONS = 'https://commons.wikimedia.org/wiki/Special:Redirect/file/';
    const commonsFile = (name) => COMMONS + encodeURIComponent(name);

    const PIECES = ['K', 'Q', 'R', 'B', 'N', 'P', 'C', 'A', 'Am', 'G', 'H', 'Ct', 'NR', 'Hu'];

    // Wikimedia Commons SVG 직접 참조.
    // 나중에 로컬 파일로 바꾸려면 값만 './pieces/white_K.svg' 같은 경로로 바꾸면 된다.
    const PIECE_SOURCES = {
      white: {
        K: commonsFile('Chess klt45.svg'),
        Q: commonsFile('Chess qlt45.svg'),
        R: commonsFile('Chess rlt45.svg'),
        B: commonsFile('Chess blt45.svg'),
        N: commonsFile('Chess nlt45.svg'),
        P: commonsFile('Chess plt45.svg'),
        C: commonsFile('Chess clt45.svg'),
        A: commonsFile('Chess alt45.svg'),
        Am: commonsFile('Chess Alt45.svg'),
        G: commonsFile('Chess Mlt45.svg'),
        Ct: commonsFile('White Centaur Xogos da Meiga chess icons family.svg'),
        // 요청 반영: Nightrider는 Unicorn 계열 이미지 사용
        NR: commonsFile('Chess Ult45.svg')
      },
      black: {
        K: commonsFile('Chess kdt45.svg'),
        Q: commonsFile('Chess qdt45.svg'),
        R: commonsFile('Chess rdt45.svg'),
        B: commonsFile('Chess bdt45.svg'),
        N: commonsFile('Chess ndt45.svg'),
        P: commonsFile('Chess pdt45.svg'),
        C: commonsFile('Chess cdt45.svg'),
        A: commonsFile('Chess adt45.svg'),
        Am: commonsFile('Chess Adt45.svg'),
        G: commonsFile('Chess Mdt45.svg'),
        Ct: commonsFile('Black Centaur Xogos da Meiga chess icons family.svg'),
        NR: commonsFile('Chess Udt45.svg')
      }
    };

    function customPieceSvg(code, color) {
      const white = color === 'white';
      const fill = white ? '#f8f8f2' : '#1f2430';
      const detail = white ? '#d8d3c4' : '#4a5361';
      const eye = white ? '#111111' : '#ffffff';
      const stroke = '#111111';
      let body = '';

      if (code === 'H') {
        // 받침대 없는 임시 Hawk 더미
        body = `
          <path d="M24 72 C28 54 35 36 49 25 C61 16 75 19 82 30 C76 28 66 28 58 34 C66 36 75 42 75 51 C75 60 66 65 56 66 C48 67 39 69 24 72 Z" fill="${fill}" stroke="${stroke}" stroke-width="4" stroke-linejoin="round"/>
          <path d="M72 39 C80 39 86 43 86 49 C82 47 77 47 72 49" fill="none" stroke="${stroke}" stroke-width="4" stroke-linecap="round"/>
          <circle cx="64" cy="42" r="2.4" fill="${eye}"/>
          <path d="M35 65 C43 55 52 49 64 45" stroke="${detail}" stroke-width="3" opacity=".8" stroke-linecap="round"/>`;
      } else if (code === 'Hu') {
        // 받침대 없는 임시 Huygen 더미
        body = `
          <path d="M30 28 H70 Q74 32 74 38 V76 H26 V38 Q26 32 30 28 Z" fill="${fill}" stroke="${stroke}" stroke-width="4"/>
          <path d="M38 18 H62 V31 H38 Z" fill="${fill}" stroke="${stroke}" stroke-width="4"/>
          <circle cx="50" cy="42" r="3" fill="${detail}"/>
          <circle cx="50" cy="54" r="3" fill="${detail}"/>
          <circle cx="50" cy="68" r="3" fill="${detail}"/>`;
      } else {
        // 외부 SVG 실패 시 보여줄 받침대 없는 더미
        body = `
          <circle cx="50" cy="34" r="15" fill="${fill}" stroke="${stroke}" stroke-width="4"/>
          <path d="M32 77 C34 56 40 48 50 48 C60 48 66 56 68 77 Z" fill="${fill}" stroke="${stroke}" stroke-width="4"/>
          <text x="50" y="67" text-anchor="middle" font-size="20" font-family="system-ui, sans-serif" font-weight="800" fill="${eye}">${code}</text>`;
      }

      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${body}</svg>`)}`;
    }

    function iconSvg(name) {
      if (name === 'edit') {
        return '<svg viewBox="0 0 24 24"><path class="stroke" d="M4 20h4l11-11a2.5 2.5 0 0 0-4-4L4 16v4Z"/><path class="stroke" d="M13 6l5 5"/></svg>';
      }
      return '<svg viewBox="0 0 24 24"><path class="stroke" d="M5 19h14"/><path class="stroke" d="M8 16l8-8a2.4 2.4 0 0 1 3.4 3.4l-8 8"/><path class="stroke" d="M14 6l4 4"/><path class="stroke" d="M6 21l3-3"/></svg>';
    }

    function updateModeUi() {
      app.classList.toggle('highlight-mode', mode === 'highlight');
      app.classList.toggle('edit-mode', mode === 'edit');
      modeToggle.innerHTML = iconSvg(mode === 'edit' ? 'edit' : 'highlight');
      modeToggle.title = mode === 'edit' ? '보드 편집 모드' : '보드 하이라이트 모드';
    }

    function renderPalette() {
      piecePalette.innerHTML = '';
      for (const code of PIECES) {
        const btn = document.createElement('button');
        btn.className = 'palette-cell piece-button';
        btn.type = 'button';
        btn.dataset.piece = code;
        btn.title = `${pieceColor === 'white' ? 'White' : 'Black'} ${code}`;

        const img = document.createElement('img');
        img.alt = code;
        img.src = PIECE_SOURCES[pieceColor]?.[code] || customPieceSvg(code, pieceColor);
        img.onerror = () => {
          img.onerror = null;
          img.src = customPieceSvg(code, pieceColor);
        };

        const label = document.createElement('span');
        label.className = 'palette-code';
        label.textContent = code;
        btn.append(img, label);
        piecePalette.append(btn);
      }

      const toggle = document.createElement('button');
      toggle.className = `palette-cell color-toggle ${pieceColor === 'white' ? 'white-side' : 'black-side'}`;
      toggle.type = 'button';
      toggle.title = '흑백 변경';
      toggle.innerHTML = `<span class="toggle-mark"><span class="disc"></span><span>${pieceColor === 'white' ? 'WHITE' : 'BLACK'}</span></span>`;
      toggle.addEventListener('click', () => {
        pieceColor = pieceColor === 'white' ? 'black' : 'white';
        renderPalette();
      });
      piecePalette.append(toggle);
    }

    function applyTransform() {
      boardLayer.style.transform = `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`;
    }

    function clampTransform() {
      const rect = boardViewport.getBoundingClientRect();
      const scaled = BOARD_SIZE * CELL_SIZE * transform.scale;
      if (scaled <= rect.width) transform.x = (rect.width - scaled) / 2;
      else transform.x = Math.min(0, Math.max(rect.width - scaled, transform.x));
      if (scaled <= rect.height) transform.y = (rect.height - scaled) / 2;
      else transform.y = Math.min(0, Math.max(rect.height - scaled, transform.y));
    }

    function resetInitialBoardView() {
      const rect = boardViewport.getBoundingClientRect();
      transform.scale = (rect.width / INITIAL_VISIBLE_CELLS) / CELL_SIZE;
      const boardCenter = (BOARD_SIZE * CELL_SIZE / 2) * transform.scale;
      transform.x = rect.width / 2 - boardCenter;
      transform.y = rect.height / 2 - boardCenter;
      clampTransform();
      applyTransform();
    }

    function viewportPoint(touch) {
      const rect = boardViewport.getBoundingClientRect();
      return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
    }
    function boardCoordFromViewport(point, tf = transform) {
      return { x: (point.x - tf.x) / tf.scale, y: (point.y - tf.y) / tf.scale };
    }
    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
    function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

    boardViewport.addEventListener('touchstart', (event) => {
      if (mode !== 'edit') return;
      event.preventDefault();
      const touches = [...event.touches];
      if (touches.length >= 3) {
        activeGesture = null;
        ignoreUntilNoTouches = true;
        return;
      }
      if (ignoreUntilNoTouches) return;
      if (touches.length === 1) {
        const p = viewportPoint(touches[0]);
        activeGesture = { type: 'pan', anchorBoard: boardCoordFromViewport(p) };
      } else if (touches.length === 2) {
        const p1 = viewportPoint(touches[0]);
        const p2 = viewportPoint(touches[1]);
        activeGesture = {
          type: 'pinch',
          startScale: transform.scale,
          startDistance: dist(p1, p2),
          anchor1: boardCoordFromViewport(p1),
          anchor2: boardCoordFromViewport(p2)
        };
      }
    }, { passive: false });

    boardViewport.addEventListener('touchmove', (event) => {
      if (mode !== 'edit') return;
      event.preventDefault();
      const touches = [...event.touches];
      if (touches.length >= 3) {
        activeGesture = null;
        ignoreUntilNoTouches = true;
        return;
      }
      if (ignoreUntilNoTouches || !activeGesture) return;

      if (activeGesture.type === 'pan' && touches.length === 1) {
        const p = viewportPoint(touches[0]);
        transform.x = p.x - activeGesture.anchorBoard.x * transform.scale;
        transform.y = p.y - activeGesture.anchorBoard.y * transform.scale;
      } else if (activeGesture.type === 'pinch' && touches.length === 2) {
        const p1 = viewportPoint(touches[0]);
        const p2 = viewportPoint(touches[1]);
        const nowDistance = Math.max(1, dist(p1, p2));
        const scaleFactor = nowDistance / Math.max(1, activeGesture.startDistance);
        transform.scale = Math.min(12, Math.max(0.08, activeGesture.startScale * scaleFactor));

        const nowMid = mid(p1, p2);
        const anchorMid = mid(activeGesture.anchor1, activeGesture.anchor2);
        transform.x = nowMid.x - anchorMid.x * transform.scale;
        transform.y = nowMid.y - anchorMid.y * transform.scale;
      }
      clampTransform();
      applyTransform();
    }, { passive: false });

    boardViewport.addEventListener('touchend', (event) => {
      if (event.touches.length === 0) {
        activeGesture = null;
        ignoreUntilNoTouches = false;
      }
    });
    boardViewport.addEventListener('touchcancel', () => {
      activeGesture = null;
      ignoreUntilNoTouches = false;
    });

    let mousePan = null;
    boardViewport.addEventListener('pointerdown', (event) => {
      if (event.pointerType === 'touch' || mode !== 'edit') return;
      const rect = boardViewport.getBoundingClientRect();
      const p = { x: event.clientX - rect.left, y: event.clientY - rect.top };
      mousePan = { anchorBoard: boardCoordFromViewport(p) };
      boardViewport.setPointerCapture(event.pointerId);
    });
    boardViewport.addEventListener('pointermove', (event) => {
      if (!mousePan || event.pointerType === 'touch') return;
      const rect = boardViewport.getBoundingClientRect();
      const p = { x: event.clientX - rect.left, y: event.clientY - rect.top };
      transform.x = p.x - mousePan.anchorBoard.x * transform.scale;
      transform.y = p.y - mousePan.anchorBoard.y * transform.scale;
      clampTransform();
      applyTransform();
    });
    boardViewport.addEventListener('pointerup', () => { mousePan = null; });
    boardViewport.addEventListener('pointercancel', () => { mousePan = null; });

    modeToggle.addEventListener('click', () => {
      mode = mode === 'edit' ? 'highlight' : 'edit';
      updateModeUi();
    });

    window.addEventListener('resize', resetInitialBoardView);

    renderPalette();
    updateModeUi();
    requestAnimationFrame(resetInitialBoardView);
  </script>
</body>
</html>
